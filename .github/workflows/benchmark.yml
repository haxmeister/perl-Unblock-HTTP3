name: HTTP/3 benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "xt/benchmark-loopback.pl"
      - "xt/benchmark-process-loopback.pl"
      - "xt/benchmark-http3-micro.pl"
      - "xt/benchmark-body-micro.pl"
      - "xt/BENCHMARKS.md"
      - ".github/workflows/benchmark.yml"

jobs:
  loopback:
    name: Loopback baseline
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
          enable-modules-cache: false

      - name: Install released CPAN dependencies
        run: |
          cpanm --notest 'Alien::nghttp3@0.01'
          cpanm --notest 'Net::QUIC@0.04'
          cpanm --notest 'Uniform::HTTP@0.04'
          cpanm --notest --installdeps .

      - name: Build
        run: |
          perl Makefile.PL
          perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Run loopback benchmark
        env:
          UNBLOCK_HTTP3_BENCH_REQUESTS: "2000"
          UNBLOCK_HTTP3_BENCH_WARMUP: "200"
          UNBLOCK_HTTP3_BENCH_BODY_BYTES: "1024"
          UNBLOCK_HTTP3_BENCH_CONCURRENCY: "1,8,16,32,64,96"
        run: |
          set -o pipefail
          perl -Iblib/lib -Iblib/arch xt/benchmark-loopback.pl 2>&1 \
            | tee "$RUNNER_TEMP/http3-benchmark.txt"

      - name: Run split-process loopback benchmark
        env:
          UNBLOCK_HTTP3_BENCH_REQUESTS: "2000"
          UNBLOCK_HTTP3_BENCH_WARMUP: "200"
          UNBLOCK_HTTP3_BENCH_BODY_BYTES: "1024"
          UNBLOCK_HTTP3_BENCH_CONCURRENCY: "1,8,16,32,64,96"
        run: |
          set -o pipefail
          perl -Iblib/lib -Iblib/arch xt/benchmark-process-loopback.pl 2>&1 \
            | tee "$RUNNER_TEMP/http3-process-benchmark.txt"

      - name: Run HTTP/3 layer microbenchmark
        env:
          UNBLOCK_HTTP3_MICRO_ITERATIONS: "20000"
          UNBLOCK_HTTP3_MICRO_NATIVE_ITERATIONS: "10000"
        run: |
          set -o pipefail
          perl -Iblib/lib -Iblib/arch xt/benchmark-http3-micro.pl 2>&1 \
            | tee "$RUNNER_TEMP/http3-micro-benchmark.txt"

      - name: Run streaming body-copy microbenchmark
        env:
          UNBLOCK_HTTP3_BODY_BENCH_BYTES: "33554432"
          UNBLOCK_HTTP3_BODY_BENCH_MAX_ITERATIONS: "50000"
          UNBLOCK_HTTP3_BODY_BENCH_SIZES: "64,1024,16384,65536,262144,1048576"
        run: |
          set -o pipefail
          perl -Iblib/lib -Iblib/arch xt/benchmark-body-micro.pl 2>&1 \
            | tee "$RUNNER_TEMP/http3-body-benchmark.txt"

      - name: Store benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http3-loopback-benchmark
          path: |
            ${{ runner.temp }}/http3-benchmark.txt
            ${{ runner.temp }}/http3-process-benchmark.txt
            ${{ runner.temp }}/http3-micro-benchmark.txt
            ${{ runner.temp }}/http3-body-benchmark.txt
