name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Perl ${{ matrix.perl }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.20"
          - "5.28"
          - "5.36"
          - "5.44"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          enable-modules-cache: false

      - name: Install released CPAN dependencies
        run: |
          cpanm --notest 'Alien::nghttp3@0.01'
          cpanm --notest 'Net::QUIC@0.04'
          cpanm --notest 'Uniform::HTTP@0.06'
          cpanm --notest --installdeps .

      - name: Verify released dependency versions
        run: |
          perl -MAlien::nghttp3 -e 'die "wrong Alien::nghttp3\n" unless $Alien::nghttp3::VERSION eq "0.01"; print "Alien::nghttp3 $Alien::nghttp3::VERSION\n"'
          perl -MNet::QUIC -e 'die "wrong Net::QUIC\n" unless $Net::QUIC::VERSION eq "0.04"; print "Net::QUIC $Net::QUIC::VERSION\n"'
          perl -MUniform::HTTP -e 'die "wrong Uniform::HTTP\n" unless $Uniform::HTTP::VERSION eq "0.06"; print "Uniform::HTTP $Uniform::HTTP::VERSION\n"'

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Test
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'

      - name: Check distribution
        if: matrix.perl == '5.44'
        run: perl -MConfig -e 'system($Config{make}, "distcheck") == 0 or exit 1'

      - name: Test distribution
        if: matrix.perl == '5.44'
        run: perl -MConfig -e 'system($Config{make}, "disttest") == 0 or exit 1'

      - name: Check installed NativeABI
        if: matrix.perl == '5.44'
        shell: bash
        run: |
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" dist

          DIST="$PWD/Unblock-HTTP3-0.10.tar.gz"
          test -f "$DIST"

          WORK="$RUNNER_TEMP/unblock-http3-nativeabi-dist"
          INSTALL="$RUNNER_TEMP/unblock-http3-nativeabi-install"

          rm -rf "$WORK" "$INSTALL"
          mkdir -p "$WORK" "$INSTALL"

          tar -xzf "$DIST" -C "$WORK"
          cd "$WORK/Unblock-HTTP3-0.10"

          perl Makefile.PL INSTALL_BASE="$INSTALL"
          "$MAKE"
          "$MAKE" install

          ARCH=$(perl -MConfig -e 'print $Config{archname}')
          export PERL5LIB="$INSTALL/lib/perl5:$INSTALL/lib/perl5/$ARCH"

          cd "$GITHUB_WORKSPACE"
          UNBLOCK_HTTP3_INSTALL_ROOT="$INSTALL" perl xt/installed-nativeabi.t

      - name: Check POD syntax
        if: matrix.perl == '5.44'
        shell: bash
        run: |
          find lib -name '*.pm' -print | while read file; do
            if grep -q '^=head1 ' "$file"; then
              podchecker "$file"
            fi
          done
